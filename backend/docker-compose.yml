services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: rack
      POSTGRES_PASSWORD: rackpw
      POSTGRES_DB: rackdb
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rack -d rackdb"]
      interval: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"   # MQTT (ESP32)
      - "9001:9001"   # MQTT over WebSocket (เว็บแดชบอร์ด)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqttdata:/mosquitto/data

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://rack:rackpw@db:5432/rackdb
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started

volumes:
  dbdata:
  mqttdata:
